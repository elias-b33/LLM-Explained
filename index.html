<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="An interactive, visual deep-dive into how large language models actually work — tokenization, embeddings, attention, training, and generation."
    />
    <title>LLM Explainer — How Language Models Actually Work</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('llm-theme');
          var choice = raw ? JSON.parse(raw) : 'dark';
          var dark =
            choice === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : choice !== 'light';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
